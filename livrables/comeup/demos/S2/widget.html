<!doctype html><meta charset=utf-8><title>Boutique Démo</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.45 'Segoe UI',Arial,sans-serif;background:#f5f3ff;color:#1e1b4b}
.bar{background:#2E1065;color:#fff;padding:10px 24px;display:flex;justify-content:space-between}.tag{background:#FACC15;color:#0f172a;font-weight:700;padding:2px 10px;border-radius:4px}
.wrap{max-width:720px;margin:20px auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px #2e106526;overflow:hidden}
.head{background:#6D28D9;color:#fff;padding:14px 18px;font-weight:700}#log{padding:16px;min-height:300px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;margin:0 0 12px}.u{background:#6D28D9;color:#fff;margin-left:auto}.b{background:#ede9fe}
.src{font-size:13px;margin-top:8px;color:#5b21b6;border-top:1px solid #c4b5fd;padding-top:6px}.nok{background:#fef3c7}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb}input{flex:1;padding:10px;border:1px solid #c4b5fd;border-radius:8px;font:inherit}button{background:#6D28D9;color:#fff;border:0;border-radius:8px;padding:0 18px;font:inherit}</style>
<div class=bar><span>Boutique Démo – assistant FAQ (page de test)</span><span class=tag>Exemple – données fictives</span></div>
<div class=wrap><div class=head>Assistant Boutique Démo</div><div id=log><div class="m b">Bonjour ! Posez-moi une question sur les retours, la livraison, le paiement ou la garantie.</div></div>
<form id=f><input id=q placeholder="Votre question…" autocomplete=off><button>Envoyer</button></form></div>
<script>
const log=document.getElementById('log');
async function send(q){ if(!q)return; add('u',q);
 const r=await (await fetch('/ask?q='+encodeURIComponent(q))).json();
 add('b'+(r.source?'':' nok'),r.answer,r.source?'Source : '+r.source:'');}
function add(c,t,s){const d=document.createElement('div');d.className='m '+c;d.textContent=t;
 if(s){const e=document.createElement('div');e.className='src';e.textContent=s;d.appendChild(e)}log.appendChild(d)}
f.onsubmit=e=>{e.preventDefault();send(q.value);q.value=''};
(async()=>{for(const q of new URLSearchParams(location.search).getAll('q'))await send(q)})();
</script>
